const LG={privacy:`<h1>Privacy Policy</h1>
<p class="mut">Nivas Hostel Manager. Effective {{DATE}}. Applies to the Nivas app and website for hostel and PG owners in Hyderabad, Telangana, India.</p>
<p class="mut"><b>Short version:</b> we collect only what the app needs, your hostel records stay on your own device, we do not sell data, we show no ads, and you can delete your account at any time from Profile, Delete account.</p>

<h2>1. Who we are and which laws apply</h2>
<p>Nivas is published by <b>{{NAME}}</b>, {{ADDR}} ("we", "us"). For the account and sign-in data described below we are the <b>Data Fiduciary</b> under the Digital Personal Data Protection Act, 2023 ("DPDP Act"). This policy is written to follow:</p>
<ul>
<li>the DPDP Act, 2023 and the Digital Personal Data Protection Rules, 2025 (notified 13 November 2025; most notice, consent and rights duties become enforceable on 13 May 2027, and we follow them from now);</li>
<li>the Information Technology Act, 2000, including Section 43A and the Reasonable Security Practices and Sensitive Personal Data or Information Rules, 2011, for as long as they remain in force;</li>
<li>the CERT-In Directions of 28 April 2022 on reporting cyber incidents;</li>
<li>other Indian laws that apply to a hostel business in Telangana, explained in section 6.</li>
</ul>

<h2>2. Two different roles</h2>
<ul>
<li><b>Hostel owner (you):</b> you decide which resident details to enter and why. For your residents' details you are the Data Fiduciary, and Nivas is only a tool that helps you keep your own records.</li>
<li><b>Resident:</b> residents do not create accounts. A resident's details appear in Nivas only because the hostel owner entered them. A resident who opens a receipt link sees only that receipt.</li>
</ul>

<h2>3. What we collect and where it is kept</h2>
<ul>
<li><b>Account data (our servers, through Google Firebase Authentication):</b> email address, a user ID, sign-in method (email and password, Google or Apple), whether the email is verified, and sign-in times. Firebase also logs technical data such as IP address for security. Passwords are stored by Firebase in hashed form; we never see them.</li>
<li><b>Business records (your device only):</b> business name, owner name, mobile number, hostel names, addresses, areas, optional map pin, prices and facilities, resident names, mobile numbers, room and sharing details, dues, payments and receipts. These are saved in your browser's storage on your own phone or computer. They are not uploaded to our servers. Clearing browser data, losing the device or deleting your account removes them, so keep your own backup.</li>
<li><b>Payment details you choose to save (your device only):</b> UPI ID, bank account holder name, bank account number and IFSC code. We never ask for card numbers, CVV, PINs, passwords or OTPs. Please do not enter Aadhaar or PAN numbers anywhere in the app; Nivas does not need them.</li>
<li><b>Camera:</b> used only after you tap Start camera or Scan, to read a QR code or barcode. Images are processed on your device and are not saved or uploaded.</li>
<li><b>Location:</b> used only when you tap Use current location or Pin exact location. Your coordinates are sent once to OpenStreetMap (Nominatim) to find the area name. A pinned location is saved with that hostel on your device.</li>
<li><b>Stored on your device by the app:</b> your chosen area, the app cache (service worker) and sign-in session. We do not use advertising or analytics trackers.</li>
</ul>

<h2>4. Why we use it, and your consent</h2>
<p>We use your data only to: create and secure your account; let you manage hostels, residents, dues and payments; show hostels for the area you pick; create receipts and let you send them from your own WhatsApp or SMS app; and answer support requests. We do not sell or rent personal data, do not profile you and do not show advertisements.</p>
<p>We rely on your consent, given when you tick the box and create an account, and, for the camera and location, when you allow the permission on your device. You may withdraw consent at any time by turning off the permission or by deleting your account. Withdrawing is as easy as giving consent. Withdrawal does not affect what was done before it, and some features will stop working.</p>

<h2>5. Residents' data and children</h2>
<ul>
<li>Enter only what you need to run the hostel, such as name, room, mobile number and payments. Tell each resident what you record and why, and keep their permission.</li>
<li>If a resident is under 18, take a parent or guardian's verifiable consent first, as the DPDP Act requires. Do not use resident data to track, profile or advertise to children.</li>
<li>Nivas itself is only for people aged 18 or above. If we learn that a child created an account, we delete it.</li>
<li>A resident may ask the hostel owner, or write to us, to see, correct or erase their details.</li>
</ul>

<h2>6. Hostel owner duties under Indian and Telangana rules</h2>
<p>Nivas is a record-keeping tool. It does not replace the registers, licences and registrations the law requires of you. In particular, for hostels in Hyderabad, Cyberabad and Rachakonda areas you should check and keep the following current:</p>
<ul>
<li>municipal <b>trade licence</b> from the Greater Hyderabad Municipal Corporation (or your local municipality);</li>
<li><b>police registration</b> (Form A) for women's hostels and PGs at your local police station, and the resident register and staff background checks the police require;</li>
<li>fire safety under the Telangana Fire Services Act, 1999 and the National Building Code;</li>
<li>FSSAI registration or licence if you serve food;</li>
<li>registration under the Telangana Shops and Establishments Act, 1988 if you employ staff, and GST registration where your turnover requires it.</li>
</ul>
<p>Rules and local orders change. Confirm the current position with the authority or an advocate or chartered accountant.</p>

<h2>7. Receipts and receipt links</h2>
<p>When you send a receipt, the receipt details (receipt number, date, hostel name, address and contact numbers, resident name, room, sharing, month, rent, advance, balance, total and your name) are placed inside the link itself. The PDF is built in the resident's browser when they open the link. We do not store receipt PDFs on a server.</p>
<p>Anyone who has the link can read the receipt, and a link cannot be withdrawn after it is sent. Send it only to the resident concerned. The message is sent from your own phone through WhatsApp (Meta) or your SMS app, and their privacy terms and your carrier's charges apply.</p>

<h2>8. Who else receives data</h2>
<ul>
<li><b>Google Firebase / Google LLC:</b> sign-in, verification and deletion emails, and hosting if you use Firebase Hosting.</li>
<li><b>Google or Apple:</b> only if you choose to sign in with them.</li>
<li><b>OpenStreetMap Foundation (Nominatim):</b> coordinates, only when you ask the app to find your area.</li>
<li><b>Razorpay public IFSC service:</b> only the IFSC code you type, to confirm that the bank branch exists.</li>
<li><b>Cloudflare cdnjs:</b> delivers the PDF, Excel and QR-reading code libraries to your browser; it sees your IP address like any website.</li>
<li><b>Authorities:</b> only where Indian law or a lawful order requires it.</li>
</ul>
<p>Our service providers may process data on servers outside India. The DPDP Act allows this unless the Central Government restricts a country. We will follow any such restriction.</p>

<h2>9. Security and breaches</h2>
<p>We use HTTPS, verified email sign-in, strong password rules, Firebase's access controls and the principle of collecting the minimum. Please also lock your phone, keep it updated and do not share your password. No system is perfectly secure. If a personal data breach affects you, we will inform you and the Data Protection Board of India as required by the DPDP Act and Rules, and report cyber incidents to CERT-In within six hours of noticing them where the Directions apply.</p>

<h2>10. How long we keep data</h2>
<p>Account data is kept while your account is active. When you delete your account we delete your Firebase account and remove the Nivas records stored on that device, and we aim to clear any backups within 30 days. We may keep minimal information for as long as a law requires, for example to answer a legal notice or to prove that a deletion was requested. Tax and accounting laws may require you to keep payment records, so keep your own copies before you delete. Receipts you already sent stay with the people who received them.</p>

<h2>11. Your rights</h2>
<p>Under the DPDP Act you may:</p>
<ul>
<li>ask for a summary of the personal data we process and who we share it with;</li>
<li>correct, complete or update your data (use Profile, Edit profile for most things);</li>
<li>ask for erasure of your data (Profile, Delete account, then confirm with the link we email you);</li>
<li>withdraw consent;</li>
<li>have a grievance answered quickly;</li>
<li>nominate another person to exercise these rights if you die or cannot act.</li>
</ul>
<p>Write to {{EMAIL}} from your registered email. We will reply within 7 days and aim to resolve the matter within 30 days (the law allows up to 90 days). You are also expected to give correct information, not to impersonate anyone and not to file false or frivolous complaints.</p>
<p><b>Delete account page:</b> <a href="#delete-account">#delete-account</a> explains how to delete your account even if you cannot open the app.</p>

<h2>12. Grievance Officer and complaints</h2>
<p><b>Grievance Officer:</b> {{NAME}}<br><b>Email:</b> {{EMAIL}}<br><b>Address:</b> {{ADDR}}<br><b>Hours:</b> {{HOURS}}</p>
<p>If we do not resolve your complaint, you may complain to the Data Protection Board of India once it is functioning and you have first used our grievance process.</p>

<h2>13. Governing law</h2>
<p>This policy is governed by the laws of India. Courts at Hyderabad, Telangana have jurisdiction, without removing any right you have under consumer or data protection law.</p>

<h2>14. Changes</h2>
<p>When our practices or the law change we will update this page and its date. If a change needs fresh consent, such as moving your records to cloud storage, we will ask you again before it starts.</p>
<p class="mut">This policy is a good-faith summary of how the app works. Have a lawyer review it before you rely on it as legal advice.</p>
`,terms:`<h1>Terms and Conditions</h1>
<p class="mut">Nivas Hostel Manager. Effective {{DATE}}. These are an electronic record under the Information Technology Act, 2000 and need no signature. They form a contract under the Indian Contract Act, 1872 between you and {{NAME}} ("we", "us").</p>

<h2>1. Acceptance and eligibility</h2>
<p>By creating an account or using Nivas you accept these Terms and the Privacy Policy. Nivas is only for hostel and PG owners and managers who are 18 or older and legally able to make a contract in India. Residents and students do not need an account.</p>

<h2>2. What Nivas does</h2>
<p>Nivas helps you list your hostels, keep resident records, note dues and payments, and make receipts as PDFs that you send by WhatsApp or SMS. It is a record-keeping tool. It is not a bank, payment gateway, payment aggregator, accountant, lawyer or licensing authority.</p>

<h2>3. Your account</h2>
<ul>
<li>Use a real email address that you can open. Keep your password secret and use a strong one.</li>
<li>You are responsible for everything done under your account. Tell us at once at {{EMAIL}} if you suspect misuse.</li>
<li>One person, one account. Do not share or sell accounts.</li>
</ul>

<h2>4. Your legal duties as a hostel owner in Telangana</h2>
<p>You alone are responsible for running your hostel lawfully. Depending on your hostel, this normally includes:</p>
<ul>
<li>a municipal trade licence from GHMC or your local body;</li>
<li>police registration (Form A for women's hostels and PGs) and the resident register and staff verification the police require;</li>
<li>fire safety and building safety under the Telangana Fire Services Act, 1999 and the National Building Code, working CCTV and safe exits;</li>
<li>FSSAI registration or licence if you serve food, and clean, safe water and sanitation;</li>
<li>Telangana Shops and Establishments Act, 1988 registration and labour law compliance if you employ staff;</li>
<li>GST and income tax registration, returns and invoices where the law requires them;</li>
<li>fair stay terms, honest advance and refund rules, and the Consumer Protection Act, 2019;</li>
<li>the Digital Personal Data Protection Act, 2023 for your residents' data, including consent from a parent or guardian for any resident under 18.</li>
</ul>
<p>Nivas does not check or guarantee that you hold any licence. Listing a hostel in Nivas is not an approval or endorsement by us or any authority.</p>

<h2>5. Payments, receipts and bank details</h2>
<ul>
<li>Nivas does <b>not</b> collect, hold, transfer or settle money. Residents pay you directly by cash, UPI, bank transfer or card. Nivas only records what you tell it.</li>
<li>Enter only <b>real</b> UPI IDs and bank accounts that belong to you or your business. Entering another person's or a made-up account is not allowed. Nivas checks the format, rejects obviously invalid numbers and confirms the IFSC against a public list, but only your bank can prove an account is genuine and yours. Send yourself a small test payment before you give the details to residents.</li>
<li>A receipt is made from what you type. You are fully responsible for its accuracy. Issue a receipt only for money you actually received. A Nivas receipt is an acknowledgement; it is not a GST tax invoice unless you add the details the law needs.</li>
<li>Deposits, advance, refunds and cancellations follow your own written stay terms and the law, not Nivas.</li>
</ul>

<h2>6. Sending receipts</h2>
<p>Receipts are sent from your own WhatsApp or SMS app, and message and data charges are yours. Send only to the resident who paid and only with their number. Anyone with the link can open the receipt, and sent links cannot be recalled.</p>

<h2>7. Acceptable use</h2>
<p>You must not: enter false or unlawful information; issue fake, duplicate or back-dated receipts to deceive anyone (this can be an offence of cheating or forgery under the Bharatiya Nyaya Sanhita, 2023); use another person's data without permission; send spam or unwanted messages; harass or discriminate against residents; try to break, copy, scrape or overload the app; or use it for money laundering, gambling or any unlawful purpose.</p>

<h2>8. Your data and our rights</h2>
<p>Your hostel and resident records are yours. They are stored on your device, so you must keep your own backup. We own the Nivas name, design and code; you get a personal, non-transferable, revocable licence to use the app. You may not copy or resell it. How we handle personal data is explained in the Privacy Policy.</p>

<h2>9. Third-party services</h2>
<p>Nivas relies on services such as Google Firebase, WhatsApp, OpenStreetMap and Razorpay's IFSC list. They may be slow, change or stop, and their own terms apply. We are not responsible for them.</p>

<h2>10. Availability</h2>
<p>We try to keep Nivas working, but it may stop for maintenance, network or provider problems or events beyond our control. Features may change.</p>

<h2>11. Suspension, termination and account deletion</h2>
<p>You may delete your account at any time from Profile, Delete account, and confirm with the link we email you. The delete-account page <a href="#delete-account">#delete-account</a> explains this too. We may suspend or close accounts that break these Terms or the law, or on a lawful order. Sections that by nature should continue, such as liability and disputes, continue after termination.</p>

<h2>12. Disclaimer and limit of liability</h2>
<p>Nivas is provided "as is" and "as available". To the fullest extent the law allows, we are not liable for indirect, special or business losses, lost profits or lost data, for disputes between owners and residents, for penalties from any authority, or for acts of third parties or events beyond our reasonable control. Our total liability for any claim is limited to the amount you paid us for Nivas in the 12 months before the claim, or Rs. 1,000 if you paid nothing. Nothing in these Terms removes rights you cannot lose under Indian consumer law, and nothing limits liability that the law does not allow to be limited.</p>

<h2>13. Indemnity</h2>
<p>You will compensate us for claims, penalties and costs that arise from your breach of these Terms or the law, your records or receipts, or your dealings with residents and authorities.</p>

<h2>14. Complaints, disputes and governing law</h2>
<p>First write to {{EMAIL}}. We will reply within 7 days and try to resolve the issue within 15 days. If that fails, both sides will try mediation in good faith before going to court. These Terms are governed by the laws of India. Subject to any right you have under the Consumer Protection Act, 2019, the courts at Hyderabad, Telangana have exclusive jurisdiction.</p>

<h2>15. Changes and general</h2>
<p>We may update these Terms. We will change the date above, and if the change is important we will show a notice in the app. Using Nivas after an update means you accept it. If any part of these Terms is held invalid, the rest continues. These Terms and the Privacy Policy are the whole agreement between you and us about Nivas.</p>

<h2>16. Contact</h2>
<p>{{NAME}}<br>{{ADDR}}<br>{{EMAIL}} ({{HOURS}})</p>
<p class="mut">Have a lawyer review these Terms before you rely on them as legal advice.</p>
`,delete:`<h1>Delete your Nivas account</h1>
<p class="mut">Nivas Hostel Manager. You can delete your account and data at any time. This page is open to everyone, with or without signing in.</p>

<h2>Option 1: delete inside the app (fastest)</h2>
<ol>
<li>Open Nivas and sign in.</li>
<li>Tap <b>Profile</b>, then <b>Delete account</b>.</li>
<li>Type <b>DELETE</b> and tap <b>Send confirmation email</b>.</li>
<li>Open the email we send to your registered address, on the same phone, and tap the link. Your account is deleted when the link opens.</li>
</ol>
<p><a class="btn" href="./">Open the app</a></p>

<h2>Option 2: you cannot open the app</h2>
<p>Email <a href="mailto:{{EMAIL}}?subject=Delete%20my%20Nivas%20account&amp;body=Please%20delete%20my%20Nivas%20account.%0A%0ARegistered%20email%3A%20%0A">{{EMAIL}}</a> from the email address you used to sign up, with the subject <b>Delete my Nivas account</b>. We will confirm by replying to that address and delete the account within 7 days.</p>

<h2>What is deleted</h2>
<ul>
<li>Your sign-in account (email, user ID, sign-in method).</li>
<li>Your business profile, hostels, residents, dues, payments, bills and saved payment details that are stored on the device where you confirm the deletion. Nivas does not keep copies of these on a server, so if you used Nivas on more than one device, clear the app data on the other devices too.</li>
</ul>

<h2>What stays</h2>

async function near(){if(!navigator.geolocation)return toast('Location is not available on this device.');toast('Finding your area...');navigator.geolocation.getCurrentPosition(async p=>{const la=p.coords.latitude,lo=p.coords.longitude;let a='';try{const j=await(await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=16&lat=${la}&lon=${lo}`)).json(),ad=j.address||{},c=[ad.suburb,ad.neighbourhood,ad.city_district,ad.village,ad.town].filter(Boolean);a=AR.find(y=>c.some(x=>x.toLowerCase()==y.toLowerCase()))||AR.find(y=>c.some(x=>x.toLowerCase().includes(y.toLowerCase())))||c[0]||''}catch{}

const UPI=/^[A-Za-z0-9][\w.\-]{1,59}@[A-Za-z][A-Za-z0-9]{1,29}$/,PSP=new Set('okaxis okhdfcbank okicici oksbi ybl ibl axl apl paytm upi ikwik fbl axisb axisbank barodampay boi cnrb csbpay dbs dlb federal hdfcbank icici idbi idfcbank indus kbl kotak mahb pnb rbl sbi sib uco unionbank unionbankofindia yesbank yapl ptyes ptsbi pthdfc ptaxis waaxis wahdfcbank wasbi waicici freecharge postbank airtel airp jupiter abfspay slice fam jio kmbl tapicici cub dcb equitas esaf hsbc ictsbi idfc iob jkb karb lvb nsdl pingpay psb rajgovhdfcbank sc srcb tmb tjsb utbi vijb ubi cmsidfc'.split(' '));
const SEQ=a=>{let m=1,u=1,d=1;for(let i=1;i<a.length;i++){const x=+a[i]-+a[i-1];u=(x==1||x==-9)?u+1:1;d=(x==-1||x==9)?d+1:1;m=Math.max(m,u,d)}return m};

if(!/^[A-Za-z][A-Za-z .'\-]{2,59}$/.test(h)||FAKE.test(h))return{bh:'Enter the real account holder name exactly as in the passbook.'};if(!/^\d{9,18}$/.test(a))return{ba:'Account number must be 9 to 18 digits.'};if(fakeAcc(a))return{ba:'This account number looks made up. Enter the real number from your passbook or cheque.'};if(a!==g('bc').replace(/\s/g,''))return{bc:'The account numbers do not match.'};if(!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(f))return{bf:'IFSC must look like SBIN0001234.'};if(g('bo')!='y')return{bo:'Confirm that the account is yours or your business.'};

{const B=([k,t,p])=>`<button data-k="${k}" aria-label="${t}" onclick="go('${k}')">${k=='more'?'<span class="av" id="avt"><svg viewBox="0 0 24 24" style="width:.9rem;height:.9rem;stroke:#fff;fill:none;stroke-width:2.4"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>':`<svg viewBox="0 0 24 24">${p}</svg>`}<span class="lb">${t}</span></button>`;$('#tabs').innerHTML=NAV.slice(0,2).map(B).join('')+'<button class="fab" aria-label="Record a payment" onclick="collect()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>'+NAV.slice(2,4).map(B).join('')}

function enh(){document.querySelectorAll('select:not([data-e])').forEach(s=>{s.dataset.e=1;s.hidden=true;const b=document.createElement('button');b.type='button';b.className='sel';const u=()=>b.textContent=(s.selectedOptions[0]||{}).text||'';u();b.onclick=()=>pick(s,u);s.after(b)});
document.querySelectorAll('input[list]:not([data-e])').forEach(i=>{i.dataset.e=1;i.removeAttribute('list');const d=document.createElement('div');d.className='sug';d.hidden=true;i.after(d);const sh=()=>{const q=i.value.trim().toLowerCase(),m=AR.filter(a=>a.toLowerCase().includes(q)).slice(0,6);d.innerHTML=m.map(a=>`<button type="button">${esc(a)}</button>`).join('');d.hidden=!m.length||(m.length==1&&m[0].toLowerCase()==q)};i.addEventListener('input',sh);i.addEventListener('focus',sh);i.addEventListener('blur',()=>setTimeout(()=>d.hidden=true,150));d.addEventListener('mousedown',e=>{const b=e.target.closest('button');if(b){e.preventDefault();i.value=b.textContent;d.hidden=true}})})}
new MutationObserver(enh).observe(document.body,{childList:true,subtree:true});
const _go=go;go=function(k){_go(k);const t=$('#top');if(TAB[k]!==undefined)t.innerHTML=`<button class="bk" onclick="go('${PAR[k]||TAB[k]}')"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Back</button><button class="xb" aria-label="Close" onclick="go('${PAR[k]||TAB[k]}')"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;else{t.innerHTML=TOP;setTop()}};
/* downloads stay inside the app: prepare, then a "file ready" sheet */
function saveBlob(b,n){PF={b,n}}
function fileSheet(back){const f=PF,fl=new File([f.b],f.n,{type:f.b.type}),can=navigator.canShare&&navigator.canShare({files:[fl]});dlg.className='';dlg.innerHTML=`<h3>Your file is ready</h3><div class="card"><b>${esc(f.n)}</b><div class="mut">${Math.max(1,Math.round(f.b.size/1024))} KB. Made on this device, nothing uploaded.</div></div><button class="btn full" id="fs">Save to device</button>${can?'<button class="btn o full" id="fh">Share or save to Files</button>':''}<button class="btn o full" id="fd">${back?'Back':'Done'}</button>`;$('#fs').onclick=()=>{dlBlob(f.b,f.n);DLD=true;toast('Saved to your Downloads')};if(can)$('#fh').onclick=async()=>{try{await navigator.share({files:[fl]});DLD=true}catch{}};$('#fd').onclick=()=>back?back():dlg.close();if(!dlg.open)dlg.showModal()}
async function runX(f,w,h,back){w=w||$('#xw').value;h=h===undefined?($('#xh')||{value:''}).value:h;PF=null;dlg.className='';dlg.innerHTML='<h3>Preparing your file</h3><div class="sp"></div><p class="mut" style="text-align:center">This takes a few seconds.</p>';if(!dlg.open)dlg.showModal();try{f=='xlsx'?await xlsx(w,h):await pdfx(w,h);if(!PF)throw 0;fileSheet(back)}catch{dlg.innerHTML='<h3>Could not make the file</h3><p>Check your internet connection and try again.</p><button class="btn full" onclick="dlg.close()">OK</button>'}}
/* delete account: download first, then confirm by email */
function delAcc(k){if(!k)DLD=false;dlg.className='';dlg.innerHTML=`<h3>Delete account</h3><p>This permanently deletes your account and every hostel, resident, bill and payment detail saved on this device. It cannot be undone.</p><div class="card"><b>1. Download a copy of your data</b><p class="mut">Everything: hostels, residents, dues and bills.</p>${DLD?'<div class="mut" style="color:var(--grn);margin-bottom:.5rem">Data downloaded</div>':''}<div class="dact"><button class="btn o" onclick="runX('xlsx','all','',()=>delAcc(1))">Excel</button><button class="btn o" onclick="runX('pdf','all','',()=>delAcc(1))">PDF</button></div></div><div class="card"><b>2. Confirm</b><label class="ck" style="padding:0;margin:.5rem 0"><input type="checkbox" id="dk"><span>I understand this cannot be undone</span></label><label>Type DELETE<input id="dc" autocomplete="off" autocapitalize="characters"></label><p class="mut">A confirmation link will be emailed to <b>${esc(EML())}</b>.</p></div><button class="btn rd full" onclick="mailAct('del')">Send confirmation email</button><button class="btn o full" onclick="dlg.close()">Keep my account</button>`;if(!dlg.open)dlg.showModal()}
function out(){dlg.className='';dlg.innerHTML=`<h3>Sign out</h3><p>For your security we will email a confirmation link to <b>${esc(EML())}</b>. Open it on this device to finish signing out.</p><button class="btn full" onclick="mailGo('out')">Send confirmation email</button><button class="btn o full" onclick="dlg.close()">Stay signed in</button>`;dlg.showModal()}
function mailAct(k){const E={};if(!$('#dk').checked)E.dk='Tick the box to continue.';if($('#dc').value.trim().toUpperCase()!='DELETE')E.dc='Type the word DELETE to continue.';if(Object.keys(E).length)return mark(E);if(!DLD)return cf('You have not downloaded your data yet. Continue without a copy?',()=>mailGo(k),{ok:'Continue',safe:1,t:'No data copy'});mailGo(k)}
async function mailGo(k){const del=k=='del',e=EML();dlg.innerHTML='<h3>Sending email</h3><div class="sp"></div>';try{if(auth&&user){await auth.sendSignInLinkToEmail(e,{url:new URL(del?'?del=1':'?out=1',SITE||location.href.split('#')[0].split('?')[0]).href,handleCodeInApp:true});try{localStorage.setItem(del?'nivasDel':'nivasOut',JSON.stringify({e,u:user.uid}))}catch{}}else if(!demo)throw 0;
dlg.innerHTML=`<h3>Check your email</h3><p>We sent a confirmation link to <b>${esc(e)}</b>. Open it on this device to ${del?'finish deleting your account':'sign out'}. Check the spam folder too.</p>${demo?'<div class="card"><b>Demo</b><p class="mut">No real email is sent in the demo. Tap below to open the link as if from your inbox.</p><button class="btn full" id="dm2">Open link in email</button></div>':''}<button class="btn o full" onclick="dlg.close()">Close</button>`;if(demo)$('#dm2').onclick=()=>{dlg.close();if(del){try{localStorage.removeItem(KEY())}catch{}}demo=false;D=null;cur='dash';route();toast(del?'Account deleted':'You are signed out')}}catch{dlg.innerHTML='<h3>Could not send the email</h3><p>Check your internet connection and try again.</p><button class="btn full" onclick="dlg.close()">OK</button>'}}
async function finishOut(){let p;try{p=JSON.parse(localStorage.getItem('nivasOut'))}catch{}try{if(!p)throw 0;await auth.signInWithEmailLink(p.e,location.href);await auth.signOut();try{localStorage.removeItem('nivasOut')}catch{}history.replaceState(null,'',location.pathname);toast('You are signed out')}catch{history.replaceState(null,'',location.pathname);toast('Could not sign out. Open the link on the same device, or try again.')}}
/* ===== v7: Firestore sync (owner-only doc owners/{uid}); offline-first, rev-checked ===== */
let FS=null,_qt=0,_csu=null;const CKy=()=>'nivas-rev:'+user.uid,DKy=()=>'nivas-dirty:'+user.uid;
function syn(s,m){let p=$('#syn');if(!p){document.body.insertAdjacentHTML('beforeend','<button id="syn" class="syn" type="button"></button>');p=$('#syn');p.onclick=()=>cloudSync()}p.dataset.s=s;p.textContent=m;p.hidden=!user;clearTimeout(p._t);if(s=='ok')p._t=setTimeout(()=>p.hidden=true,3000)}
const okData=o=>o&&['hostels','res','dues','bills'].every(k=>Array.isArray(o[k]));
function keepBackup(tag,obj){try{const k='nivas-backup:'+user.uid+':'+tag+':'+Date.now();localStorage.setItem(k,JSON.stringify(obj));Object.keys(localStorage).filter(x=>x.startsWith('nivas-backup:'+user.uid+':'+tag)).sort().slice(0,-3).forEach(x=>localStorage.removeItem(x))}catch{}}
function adopt(r){const o=JSON.parse(r.data);if(!okData(o))throw new Error('bad cloud data');keepBackup('local',D);D=o;try{localStorage.setItem(KEY(),JSON.stringify(D));localStorage.setItem(CKy(),r.rev);localStorage.removeItem(DKy())}catch{}go(cur);syn('ok','Synced')}
async function pushDoc(ref,base){const data=JSON.stringify(D);if(data.length>900000){syn('err','Too large to sync');return}await FS.runTransaction(async t=>{const s=await t.get(ref);if(s.exists?s.exists:s.exists===undefined){}const rev=s.exists?s.data().rev:0;if(rev!==base)throw Object.assign(new Error('conflict'),{code:'conflict'});const v={data,rev:base+1,schema:1,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};s.exists?t.update(ref,v):t.set(ref,v)});localStorage.setItem(CKy(),base+1);localStorage.removeItem(DKy());syn('ok','Synced')}
async function cloudSync(){if(!user||!window.firebase||!firebase.firestore)return;try{FS=FS||firebase.firestore();syn('busy','Syncing…');const ref=FS.collection('owners').doc(user.uid),s=await ref.get(),lr=+localStorage.getItem(CKy())||0,dirty=!!localStorage.getItem(DKy()),r=s.exists?s.data():null;
if(!r)return await pushDoc(ref,0);if(r.rev===lr){dirty?await pushDoc(ref,lr):syn('ok','Synced');return}
if(!dirty)return adopt(r);
cf('The cloud copy and this device both have changes.\nChoose which one to keep. The other is saved as a backup on this device.',()=>adopt(r),{t:'Data differs',ok:'Use cloud copy',cl:'Keep this device',safe:1,no:async()=>{try{keepBackup('cloud',JSON.parse(r.data));await pushDoc(ref,r.rev)}catch{syn('err','Sync failed. Tap to retry')}}})}catch(e){syn(navigator.onLine?'err':'off',navigator.onLine?'Sync failed. Tap to retry':'Offline. Saved on this device')}}
function cloudQueue(){if(!user||!window.firebase||!firebase.firestore)return;clearTimeout(_qt);syn('busy','Saving…');_qt=setTimeout(cloudSync,1500)}
addEventListener('online',()=>cloudSync());
const _rt=route;route=function(){_rt();if(user&&_csu!==user.uid){_csu=user.uid;cloudSync()}else if(!user){_csu=null;const p=$('#syn');if(p)p.hidden=true}};

if(p)finishDel(p);else ask('Confirm deletion',[['de','Type the email address that received this link']],g=>{finishDel({e:g('de'),u:''})},'Delete my account')}
